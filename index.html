<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLSC 502 Week 11: Estimation and Maximum Likelihood</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0b57d0; --code:#f6f8fa; --th:#f0f3f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1419; --fg:#e6e8eb; --muted:#9aa4af; --line:#2b333c; --accent:#7ab0ff; --code:#171d24; --th:#1a2129; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 1rem; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 17px/1.65 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  .layout { display:flex; align-items:flex-start; max-width:1200px; margin:0 auto; }
  nav { position:sticky; top:0; width:300px; flex:none; max-height:100vh; overflow-y:auto;
        padding:1.5rem 1rem 2rem 1.5rem; font:14px/1.4 system-ui, sans-serif; border-right:1px solid var(--line); }
  nav h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 .75rem; }
  nav a { display:block; padding:.25rem 0; color:var(--fg); text-decoration:none; }
  nav a:hover { color:var(--accent); }
  main { flex:1; min-width:0; padding:2rem 2.5rem 6rem; max-width:860px; }
  h1,h2,h3,h4 { font-family: system-ui, sans-serif; line-height:1.25; }
  h1 { font-size:2rem; margin-top:0; }
  h2 { font-size:1.5rem; margin-top:3rem; padding-bottom:.3rem; border-bottom:1px solid var(--line); }
  h3 { font-size:1.2rem; margin-top:2rem; }
  a { color:var(--accent); }
  code { font:0.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:var(--code); padding:.15em .35em; border-radius:4px; }
  pre { background:var(--code); border:1px solid var(--line); border-radius:8px; padding:1rem; overflow-x:auto; }
  pre code { background:none; padding:0; font-size:.85em; line-height:1.5; }
  .tablewrap { overflow-x:auto; margin:1rem 0; }
  table { border-collapse:collapse; font:15px/1.45 system-ui, sans-serif; min-width:100%; }
  th,td { border:1px solid var(--line); padding:.5rem .7rem; text-align:left; vertical-align:top; }
  th { background:var(--th); }
  blockquote { margin:1rem 0; padding:.1rem 1rem; border-left:4px solid var(--line); color:var(--muted); }
  .katex-display { overflow-x:auto; overflow-y:hidden; padding:.3rem 0; }
  #status { color:var(--muted); font-family:system-ui, sans-serif; }
  .meta { font:14px system-ui, sans-serif; margin-top:3rem; padding-top:1rem; border-top:1px solid var(--line); color:var(--muted); }
  @media (max-width: 900px) {
    .layout { display:block; }
    nav { position:static; width:auto; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding:1rem; }
    nav .sub { display:none; }
    main { padding:1.25rem 1.1rem 4rem; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="toc" aria-label="Table of contents"><h2>Contents</h2></nav>
  <main>
    <article id="content"><p id="status">Loading notes…</p></article>
    <p class="meta">Source on GitHub:
      <a href="https://github.com/pbc5320/PLSC502Week12Notes/tree/main/week-11">week-11/</a>
      (notes as Markdown, plus R scripts for the simulations).</p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
(async function () {
  const SRC = "week-11/notes/week-11-estimation-and-mle.md";
  const content = document.getElementById("content");
  const toc = document.getElementById("toc");
  try {
    const res = await fetch(SRC);
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const md = await res.text();

    // ```math fences become typeset display equations (same fences GitHub renders)
    const renderer = new marked.Renderer();
    const baseCode = renderer.code.bind(renderer);
    renderer.code = function (code, lang, escaped) {
      const text = typeof code === "object" ? code.text : code;
      const language = typeof code === "object" ? code.lang : lang;
      if (language === "math") {
        return '<div class="katex-display">' +
          katex.renderToString(text, { displayMode: true, throwOnError: false }) + "</div>";
      }
      return baseCode(code, lang, escaped);
    };
    content.innerHTML = marked.parse(md, { renderer: renderer, gfm: true });

    // Wrap tables so wide ones scroll instead of breaking the layout
    content.querySelectorAll("table").forEach(t => {
      const w = document.createElement("div"); w.className = "tablewrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    // Heading ids and sidebar contents (Parts as top level, subsections nested)
    const used = new Set();
    const slug = s => s.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") || "section";
    content.querySelectorAll("h2, h3").forEach(h => {
      let id = slug(h.textContent), n = 2;
      while (used.has(id)) id = slug(h.textContent) + "-" + n++;
      used.add(id); h.id = id;
      const a = document.createElement("a");
      a.href = "#" + id; a.textContent = h.textContent;
      if (h.tagName === "H3") { a.className = "sub"; a.style.paddingLeft = "1rem"; a.style.fontSize = "13px"; a.style.color = "var(--muted)"; }
      toc.appendChild(a);
    });

    const title = content.querySelector("h1");
    if (title) document.title = title.textContent;
    if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
  } catch (err) {
    content.innerHTML = '<p id="status">Could not load the notes (' + err.message +
      '). Open them directly on GitHub: <a href="https://github.com/pbc5320/PLSC502Week12Notes/blob/main/' + SRC + '">' + SRC + '</a>.</p>';
  }
})();
</script>
</body>
</html>
